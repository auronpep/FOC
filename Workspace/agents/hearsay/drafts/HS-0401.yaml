explanation:
  correct_answer_explanation: A is best. Paul's statement is an out-of-court assertion, but Mary offers it to show why she stopped sending follow-up notices and changed the small group's event plan. That is an effect-on-listener and reason-for-action use, not proof that the retreat center actually received the notice. The court may admit the statement for that limited purpose and give a limiting instruction if requested.
  wrong_answer_explanations:
    A: Correct for the limited nontruth route; it keeps the statement from becoming all-purpose proof of receipt.
    B: Wrong. The statement is not admitted because Paul's own words prove agency or authority. Agency foundation cannot rest solely on the alleged agent's statement, and the proponent is using listener effect instead.
    C: Wrong. This imports a cause/fault scope problem from a different hearsay setting. The resolving move here is purpose, not a medical or fault exception.
    D: Wrong. The original-writing problem does not control because Mary is not proving the contents of the mailed notice. The relevant evidence is what she heard and how that affected her conduct.
  black_letter_law_verification: Under FRE 801 and 802, a statement offered for something other than the truth of the matter asserted is outside the hearsay bar. Under FRE 105, a limiting instruction may confine the evidence to the proper nontruth purpose.
  lawyer_confirmation_authorities:
    - FRE 801
    - FRE 802
    - FRE 105
  student_access_note: In the study group, ask first whether the statement is being used as a receipt-proving fact or as the reason Mary acted.
student_learning_layer:
  program_frame: "Christian study group diagnostic: identify the statement before hunting exceptions."
  distilled_core_question: Is Paul's phone statement being used to prove receipt, or to explain Mary's next step?
  review_truth: A statement offered to show its effect on the listener is not admitted for the truth of what it asserts.
  bar_matrix_takeaway: Red-zone repair begins by splitting asserted proposition from offered proposition before naming any exception.
  gold_keys:
    - type: distinction
      label: Truth use versus listener effect
      rule: If the listener's reaction is the point, the statement may be limited to that nontruth purpose.
  silver_keys:
