question:
  stem: Mary coordinates a private Christian bar-prep small group that rents a retreat-center room for a prayer-and-practice study night. After the group mailed a cancellation notice, Mary spoke by phone with Paul, the center's scheduling employee. Paul told Mary that the center had received the notice and that she did not need to send another copy. In the center's later suit for the cancellation fee, Mary offers testimony about Paul's statement only to explain why she stopped sending follow-up notices and moved the fellowship supper to Lydia's bookstore room. The center objects on hearsay grounds.
  call: How should the court rule?
  choices:
    A: Admit the statement only for its effect on Mary and her reason for action, with a limiting instruction if requested.
    B: Admit the statement for the truth because Paul's own words prove that he had authority to speak for the retreat center.
    C: Exclude the statement because cause or fault statements are not admissible merely because they explain the dispute.
    D: Exclude the testimony unless the cancellation letter itself is read or received as an exhibit.
  correct_answer: A
answer_array_geometry:
  geometry_type: admissible_scope_ladder
  correct_answer_unique_axis: Limited nontruth use for listener effect, not substantive proof of receipt.
  clash_pair:
    - A
    - B
  dominant_trap_choice: B
  dominant_trap_axis: Treating the statement as a substantive authorized-agent admission and letting the words prove authority.
